apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-probe
  namespace: eso-ci
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: fake
    kind: SecretStore
  target:
    name: eso-probe
    creationPolicy: Owner
  data:
    - secretKey: probe
      remoteRef:
        key: /eso/probe
