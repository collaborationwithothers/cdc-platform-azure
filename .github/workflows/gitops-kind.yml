name: gitops-kind

# The disposable-layer verification for the GitOps bootstrap is "containers":
# Argo CD runs against a kind cluster in CI, with no Azure. This job installs
# Argo CD from the pinned chart, applies the one root Application pointed at the
# branch under test, and waits for it to report Synced.

on:
  pull_request:
    paths:
      - "gitops/**"
      - "infra/disposable/argocd.tf"
      - "infra/disposable/kafka/**"
      - ".github/workflows/gitops-kind.yml"
      - ".github/fixtures/eso/**"
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - "infra/disposable/argocd.tf"
      - "infra/disposable/kafka/**"
      - ".github/workflows/gitops-kind.yml"
      - ".github/fixtures/eso/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gitops-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argocd-root-synced:
    name: gitops applications reconcile on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: verify Argo CD is the only Strimzi delivery owner
        run: |
          test ! -e infra/disposable/strimzi.tf
          test ! -e .github/workflows/strimzi-schema.yml
          if grep -R --include='*.tf' -E \
            'resource "helm_release" "(strimzi_operator|kafka_resources)"' \
            infra/disposable; then
            echo "::error::A Terraform Strimzi delivery path still exists."
            exit 1
          fi

      # kind v0.31.0 ships with this action release; it creates the cluster and
      # writes the kubeconfig the later steps use.
      - name: create kind cluster
        uses: helm/kind-action@v1.14.0

      - uses: azure/setup-helm@v4

      # The same chart and version the disposable layer pins in argocd.tf.
      - name: install argo cd
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          helm install argocd argo/argo-cd \
            --version 10.4.0 \
            --namespace argocd --create-namespace \
            --wait --timeout 10m

      # Render the committed root Application, overriding the ref to the branch
      # under test so Argo syncs this pull request's tree rather than main's.
      - name: apply the root application at the branch under test
        env:
          ARGO_TARGET_REVISION: ${{ github.head_ref || github.ref_name }}
        run: |
          helm template argocd-root gitops/bootstrap \
            --set repoURL=https://github.com/${{ github.repository }}.git \
            --set targetRevision="$ARGO_TARGET_REVISION" \
            | kubectl apply --namespace argocd -f -

      # With automated sync the root Application reconciles on its own. The
      # branch may expose an Argo-managed ESO child Application.
      - name: wait for the root application to report Synced
        run: |
          kubectl wait --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/root --timeout=300s

      # This kind path tests ESO installation and reconciliation only. Azure
      # authentication, workload identity, federation, RBAC, and Key Vault
      # access are not tested here.
      - name: install or wait for ESO
        run: |
          if kubectl get --namespace argocd application/eso >/dev/null 2>&1; then
            echo "Using the Argo-managed ESO Application."
            kubectl wait --namespace argocd \
              --for=jsonpath='{.status.sync.status}'=Synced \
              application/eso --timeout=300s
            kubectl wait --namespace argocd \
              --for=jsonpath='{.status.health.status}'=Healthy \
              application/eso --timeout=300s
          else
            echo "No Argo-managed ESO Application exists; installing the pinned chart."
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update external-secrets
            helm upgrade --install external-secrets external-secrets/external-secrets \
              --version 2.9.0 \
              --namespace external-secrets --create-namespace \
              --wait --timeout 10m
          fi

      - name: apply ESO kind fixtures
        run: |
          kubectl create namespace eso-ci --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f .github/fixtures/eso/fake-secret-store.yaml
          kubectl apply -f .github/fixtures/eso/fake-external-secret.yaml

      - name: wait for ESO fixtures
        run: |
          kubectl wait --namespace eso-ci \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'=True \
            secretstore/fake --timeout=300s
          kubectl wait --namespace eso-ci \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'=True \
            externalsecret/eso-probe --timeout=300s

      - name: verify the hydrated synthetic value
        run: |
          probe_value="$(kubectl get secret eso-probe --namespace eso-ci -o jsonpath='{.data.probe}' | base64 --decode)"
          if [ "$probe_value" != "hydrated-by-eso" ]; then
            echo "::error::ESO hydrated probe did not match the expected synthetic value."
            exit 1
          fi

      - name: wait for the Strimzi Application at the branch under test
        env:
          ARGO_TARGET_REVISION: ${{ github.head_ref || github.ref_name }}
        run: |
          kubectl wait --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/workloads --timeout=300s
          kubectl wait --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/strimzi --timeout=600s
          actual_revision="$(kubectl get application/strimzi --namespace argocd \
            -o jsonpath='{.spec.sources[1].targetRevision}')"
          if [ "$actual_revision" != "$ARGO_TARGET_REVISION" ]; then
            echo "::error::Strimzi reconciled $actual_revision instead of $ARGO_TARGET_REVISION."
            exit 1
          fi

      - name: wait for Strimzi and Kafka
        run: |
          kubectl wait --namespace kafka --for=condition=Available \
            deployment/strimzi-cluster-operator --timeout=300s
          kubectl wait --namespace kafka --for=condition=Ready \
            kafka/cdc-platform --timeout=600s
          kubectl wait --namespace kafka --for=condition=Ready \
            pod --selector=strimzi.io/name=cdc-platform-kafka --timeout=300s
          kubectl wait --namespace kafka --for=condition=Ready \
            kafkatopic --all --timeout=300s
          kubectl wait --namespace kafka --for=condition=Ready \
            kafkauser --all --timeout=300s

      - name: verify topics, users, and ACL declarations
        run: |
          kubectl get kafkatopics --namespace kafka -o json | jq -e '
            [.items[].metadata.name] | sort == [
              "connect-configs",
              "connect-offsets",
              "connect-signals",
              "connect-status",
              "notifier-control",
              "schema-history-lexfield-001",
              "schema-history-lexfield-002",
              "schema-history-lexfield-003",
              "workflow-transitions",
              "workflow-transitions-lexfield-003",
              "workflow-transitions-parked"
            ]'
          kubectl get kafkausers --namespace kafka -o json | jq -e '
            [.items[].metadata.name] | sort == [
              "connect", "notifier", "operations", "queue-builder"
            ]'
          kubectl get kafkausers --namespace kafka -o json | jq -e '
            all(.items[]; ((.spec.authorization.acls // []) | length) > 0)'

      - name: dump argo state on failure
        if: failure()
        run: |
          kubectl --namespace argocd get applications -o yaml || true
          kubectl --namespace argocd describe application root || true
          kubectl --namespace argocd get pods || true

      - name: dump ESO state on failure
        if: failure()
        run: |
          kubectl --namespace argocd get applications -o wide || true
          kubectl --namespace argocd describe application eso || true
          kubectl --namespace external-secrets get pods,deployments -o wide || true
          kubectl --namespace external-secrets get events --sort-by=.lastTimestamp || true
          kubectl --namespace eso-ci get secretstores,externalsecrets -o yaml || true
          kubectl --namespace eso-ci describe secretstore fake || true
          kubectl --namespace eso-ci describe externalsecret eso-probe || true
          kubectl --namespace eso-ci get events --sort-by=.lastTimestamp || true

      - name: dump Strimzi state on failure
        if: failure()
        run: |
          kubectl --namespace argocd describe application workloads || true
          kubectl --namespace argocd describe application strimzi || true
          kubectl --namespace kafka get pods,kafka,kafkanodepools,kafkatopics,kafkausers -o wide || true
          kubectl --namespace kafka describe kafka cdc-platform || true
          kubectl --namespace kafka get events --sort-by=.lastTimestamp || true
