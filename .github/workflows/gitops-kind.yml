name: gitops-kind

# The disposable-layer verification for the GitOps bootstrap is "containers":
# Argo CD runs against a kind cluster in CI, with no Azure. This job installs
# Argo CD from the pinned chart, applies the one root Application pointed at the
# branch under test, and waits for it to report Synced.

on:
  pull_request:
    paths:
      - "gitops/**"
      - "infra/disposable/argocd.tf"
      - "infra/disposable/kafka/**"
      - "connect/image/**"
      - ".github/workflows/gitops-kind.yml"
      - ".github/fixtures/eso/**"
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - "infra/disposable/argocd.tf"
      - "infra/disposable/kafka/**"
      - "connect/image/**"
      - ".github/workflows/gitops-kind.yml"
      - ".github/fixtures/eso/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gitops-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argocd-root-synced:
    name: gitops applications reconcile on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONNECT_CI_IMAGE: cdc-connect:kind-ci
      CONNECT_CI_IDENTITY_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
    steps:
      - uses: actions/checkout@v4

      - name: verify Argo CD is the only Strimzi delivery owner
        run: |
          test ! -e infra/disposable/strimzi.tf
          test ! -e .github/workflows/strimzi-schema.yml
          if grep -R --include='*.tf' -E \
            'resource "helm_release" "(strimzi_operator|kafka_resources)"' \
            infra/disposable; then
            echo "::error::A Terraform Strimzi delivery path still exists."
            exit 1
          fi

      # kind v0.31.0 ships with this action release; it creates the cluster and
      # writes the kubeconfig the later steps use.
      - name: create kind cluster
        uses: helm/kind-action@v1.14.0

      - uses: azure/setup-helm@v4

      - name: render and schema-validate the Connect resource
        run: |
          python3 -m pip install --disable-pip-version-check \
            PyYAML==6.0.3 jsonschema==4.26.0
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/strimzi-crds-1.2.0.yaml" \
            https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.2.0/strimzi-crds-1.2.0.yaml
          echo "6f300e77128dc0963b8a6153c520a0f11b6f8999486a9b8e361c06aaa17860a3  $RUNNER_TEMP/strimzi-crds-1.2.0.yaml" \
            | sha256sum --check --strict
          helm template connect gitops/workloads/connect \
            --namespace kafka \
            --set-string image="$CONNECT_CI_IMAGE" \
            --set-string identityClientId="$CONNECT_CI_IDENTITY_CLIENT_ID" \
            > "$RUNNER_TEMP/connect-rendered.yaml"
          expect_render_failure() {
            label="$1"
            expected="$2"
            shift 2
            if output="$(helm template "$@" 2>&1)"; then
              echo "::error::$label unexpectedly rendered."
              exit 1
            fi
            printf '%s\n' "$output" | grep -F "$expected"
          }
          expect_render_failure "Connect chart without image" "Missing input: image" \
            connect gitops/workloads/connect --namespace kafka --set-string identityClientId="$CONNECT_CI_IDENTITY_CLIENT_ID"
          expect_render_failure "Connect chart without identity" "Missing input: identityClientId" \
            connect gitops/workloads/connect --namespace kafka --set-string image="$CONNECT_CI_IMAGE"
          expect_render_failure "Workloads chart without Connect image" "Missing input: connect.image" \
            workloads gitops/workloads --set connect.enabled=true --set-string connect.identityClientId="$CONNECT_CI_IDENTITY_CLIENT_ID"
          expect_render_failure "Workloads chart without Connect identity" "Missing input: connect.identityClientId" \
            workloads gitops/workloads --set connect.enabled=true --set-string connect.image="$CONNECT_CI_IMAGE"
          python3 infra/disposable/kafka/validate.py \
            --crds "$RUNNER_TEMP/strimzi-crds-1.2.0.yaml" \
            "$RUNNER_TEMP/connect-rendered.yaml"
          python3 - "$RUNNER_TEMP/connect-rendered.yaml" <<'PY'
          import os
          import sys
          import yaml

          with open(sys.argv[1], encoding="utf-8") as stream:
              resources = [item for item in yaml.safe_load_all(stream) if item]

          if len(resources) != 1 or resources[0].get("kind") != "KafkaConnect":
              raise SystemExit("Connect chart must render exactly one KafkaConnect resource.")

          resource = resources[0]
          spec = resource["spec"]
          expected = {
              "version": "4.3.1",
              "replicas": 2,
              "image": os.environ["CONNECT_CI_IMAGE"],
              "bootstrapServers": "cdc-platform-kafka-bootstrap:9093",
              "groupId": "connect-cluster",
              "configStorageTopic": "connect-configs",
              "offsetStorageTopic": "connect-offsets",
              "statusStorageTopic": "connect-status",
          }
          for key, value in expected.items():
              if spec.get(key) != value:
                  raise SystemExit(f"KafkaConnect {key} did not match the approved contract.")

          if spec["config"].get("connect.protocol") != "sessioned":
              raise SystemExit("KafkaConnect must pin connect.protocol to sessioned.")
          if spec["config"].get("scheduled.rebalance.max.delay.ms") != 300000:
              raise SystemExit("KafkaConnect must pin the scheduled rebalance delay.")
          if resource["metadata"].get("namespace") != "kafka":
              raise SystemExit("KafkaConnect must share the kafka namespace with its TLS secrets.")
          if spec["template"]["pod"]["metadata"]["labels"].get("azure.workload.identity/use") != "true":
              raise SystemExit("KafkaConnect pods must opt in to Azure workload identity.")
          if spec["template"]["serviceAccount"]["metadata"]["annotations"].get("azure.workload.identity/client-id") != os.environ["CONNECT_CI_IDENTITY_CLIENT_ID"]:
              raise SystemExit("KafkaConnect service account must carry the supplied client ID.")
          PY

      - name: build and load the Connect image into kind
        run: |
          docker build --file connect/image/Dockerfile \
            --tag "$CONNECT_CI_IMAGE" connect/image
          kind_cluster="$(kind get clusters | head -n 1)"
          test -n "$kind_cluster"
          kind load docker-image "$CONNECT_CI_IMAGE" --name "$kind_cluster"

      # The same chart and version the disposable layer pins in argocd.tf.
      - name: install argo cd
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          helm install argocd argo/argo-cd \
            --version 10.4.0 \
            --namespace argocd --create-namespace \
            --wait --timeout 10m

      # Render the committed root Application, overriding the ref to the branch
      # under test so Argo syncs this pull request's tree rather than main's.
      - name: apply the root application at the branch under test
        env:
          ARGO_TARGET_REVISION: ${{ github.head_ref || github.ref_name }}
        run: |
          helm template argocd-root gitops/bootstrap \
            --set repoURL=https://github.com/${{ github.repository }}.git \
            --set targetRevision="$ARGO_TARGET_REVISION" \
            --set connect.enabled=true \
            --set-string connect.image="$CONNECT_CI_IMAGE" \
            --set-string connect.identityClientId="$CONNECT_CI_IDENTITY_CLIENT_ID" \
            | kubectl apply --namespace argocd -f -

      # With automated sync the root Application reconciles on its own. The
      # branch may expose an Argo-managed ESO child Application.
      - name: wait for the root application to report Synced
        run: |
          kubectl wait --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/root --timeout=300s

      # This kind path tests ESO installation and reconciliation only. Azure
      # authentication, workload identity, federation, RBAC, and Key Vault
      # access are not tested here.
      - name: install or wait for ESO
        run: |
          if kubectl get --namespace argocd application/eso >/dev/null 2>&1; then
            echo "Using the Argo-managed ESO Application."
            kubectl wait --namespace argocd \
              --for=jsonpath='{.status.sync.status}'=Synced \
              application/eso --timeout=300s
            kubectl wait --namespace argocd \
              --for=jsonpath='{.status.health.status}'=Healthy \
              application/eso --timeout=300s
          else
            echo "No Argo-managed ESO Application exists; installing the pinned chart."
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update external-secrets
            helm upgrade --install external-secrets external-secrets/external-secrets \
              --version 2.9.0 \
              --namespace external-secrets --create-namespace \
              --wait --timeout 10m
          fi

      - name: apply ESO kind fixtures
        run: |
          kubectl create namespace eso-ci --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f .github/fixtures/eso/fake-secret-store.yaml
          kubectl apply -f .github/fixtures/eso/fake-external-secret.yaml

      - name: wait for ESO fixtures
        run: |
          kubectl wait --namespace eso-ci \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'=True \
            secretstore/fake --timeout=300s
          kubectl wait --namespace eso-ci \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'=True \
            externalsecret/eso-probe --timeout=300s

      - name: verify the hydrated synthetic value
        run: |
          probe_value="$(kubectl get secret eso-probe --namespace eso-ci -o jsonpath='{.data.probe}' | base64 --decode)"
          if [ "$probe_value" != "hydrated-by-eso" ]; then
            echo "::error::ESO hydrated probe did not match the expected synthetic value."
            exit 1
          fi

      - name: wait for the Strimzi and Connect Applications at the branch under test
        env:
          ARGO_TARGET_REVISION: ${{ github.head_ref || github.ref_name }}
        run: |
          kubectl wait --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/workloads --timeout=300s
          kubectl wait --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/strimzi --timeout=600s
          kubectl wait --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/connect --timeout=600s
          actual_revision="$(kubectl get application/strimzi --namespace argocd \
            -o jsonpath='{.spec.sources[1].targetRevision}')"
          if [ "$actual_revision" != "$ARGO_TARGET_REVISION" ]; then
            echo "::error::Strimzi reconciled $actual_revision instead of $ARGO_TARGET_REVISION."
            exit 1
          fi
          actual_connect_revision="$(kubectl get application/connect --namespace argocd \
            -o jsonpath='{.spec.source.targetRevision}')"
          if [ "$actual_connect_revision" != "$ARGO_TARGET_REVISION" ]; then
            echo "::error::Connect reconciled $actual_connect_revision instead of $ARGO_TARGET_REVISION."
            exit 1
          fi

      - name: wait for Strimzi and Kafka
        run: |
          kubectl wait --namespace kafka --for=condition=Available \
            deployment/strimzi-cluster-operator --timeout=300s
          kubectl wait --namespace kafka --for=condition=Ready \
            kafka/cdc-platform --timeout=600s
          kubectl wait --namespace kafka --for=condition=Ready \
            pod --selector=strimzi.io/name=cdc-platform-kafka --timeout=300s
          kubectl wait --namespace kafka --for=condition=Ready \
            kafkatopic --all --timeout=300s
          kubectl wait --namespace kafka --for=condition=Ready \
            kafkauser --all --timeout=300s

      - name: verify topics, users, and ACL declarations
        run: |
          kubectl get kafkatopics --namespace kafka -o json | jq -e '
            ([.items[].metadata.name] | sort == [
                "connect-configs",
                "connect-offsets",
                "connect-signals-lexfield-001",
                "connect-signals-lexfield-002",
                "connect-signals-lexfield-003",
                "connect-status",
                "notifier-control",
                "schema-history-lexfield-001",
                "schema-history-lexfield-002",
                "schema-history-lexfield-003",
                "workflow-transitions",
                "workflow-transitions-lexfield-003",
                "workflow-transitions-parked"
              ])
            and
            ([.items[]
              | select(.metadata.name | startswith("connect-signals-"))]
              | length == 3 and all(.[]; .spec.partitions == 1))'
          kubectl get kafkausers --namespace kafka -o json | jq -e '
            [.items[].metadata.name] | sort == [
              "connect", "notifier", "operations", "queue-builder"
            ]'
          kubectl get kafkausers --namespace kafka -o json | jq -e '
            all(.items[]; ((.spec.authorization.acls // []) | length) > 0)'
          kubectl get kafkausers --namespace kafka -o json | jq -e '
            (.items[] | select(.metadata.name == "connect")) as $connect |
            (.items[] | select(.metadata.name == "operations")) as $operations |
            any($connect.spec.authorization.acls[];
              .resource == {type: "topic", name: "connect-signals-", patternType: "prefix"}
              and (.operations | sort) == ["Describe", "Read"])
            and any($connect.spec.authorization.acls[];
              .resource == {type: "group", name: "kafka-signal-", patternType: "prefix"}
              and .operations == ["Read"])
            and any($operations.spec.authorization.acls[];
              .resource == {type: "topic", name: "connect-signals-", patternType: "prefix"}
              and (.operations | sort) == ["Describe", "Write"])'

      - name: wait for two Connect workers
        run: |
          kubectl wait --namespace kafka --for=condition=Ready \
            kafkaconnect/connect --timeout=600s
          kubectl wait --namespace kafka --for=condition=Ready \
            pod --selector=strimzi.io/name=connect-connect --timeout=300s
          kubectl get kafkaconnect/connect --namespace kafka -o json | jq -e '
            .status.replicas == 2 and
            any(.status.conditions[]; .type == "Ready" and .status == "True")'
          kubectl get pods --namespace kafka \
            --selector=strimzi.io/name=connect-connect -o json | jq -e '
            (.items | length) == 2 and
            all(.items[];
              .status.phase == "Running" and
              ([.status.containerStatuses[]?.ready] | length) > 0 and
              all(.status.containerStatuses[]; .ready))'

      - name: verify Connect configuration and workload identity declarations
        run: |
          kubectl get kafkaconnect/connect --namespace kafka -o json | jq -e \
            --arg client_id "$CONNECT_CI_IDENTITY_CLIENT_ID" '
            .spec.replicas == 2 and
            .spec.config["connect.protocol"] == "sessioned" and
            .spec.config["scheduled.rebalance.max.delay.ms"] == 300000 and
            .spec.template.pod.metadata.labels["azure.workload.identity/use"] == "true" and
            .spec.template.serviceAccount.metadata.annotations["azure.workload.identity/client-id"] == $client_id'
          kubectl get serviceaccount/connect-connect --namespace kafka -o json | jq -e \
            --arg client_id "$CONNECT_CI_IDENTITY_CLIENT_ID" '
            .metadata.annotations["azure.workload.identity/client-id"] == $client_id'
          kubectl get pods --namespace kafka \
            --selector=strimzi.io/name=connect-connect -o json | jq -e '
            (.items | length) == 2 and
            all(.items[]; .metadata.labels["azure.workload.identity/use"] == "true")'
          {
            echo "### Verified Kafka Connect on kind"
            echo
            echo "Two Kafka Connect workers became ready with the approved worker configuration and declared workload identity metadata."
            echo "This kind run does not exercise Azure federation, Azure Container Registry authentication, or SQL Server-to-Kafka delivery."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: dump argo state on failure
        if: failure()
        run: |
          kubectl --namespace argocd get applications -o yaml || true
          kubectl --namespace argocd describe application root || true
          kubectl --namespace argocd get pods || true

      - name: dump ESO state on failure
        if: failure()
        run: |
          kubectl --namespace argocd get applications -o wide || true
          kubectl --namespace argocd describe application eso || true
          kubectl --namespace external-secrets get pods,deployments -o wide || true
          kubectl --namespace external-secrets get events --sort-by=.lastTimestamp || true
          kubectl --namespace eso-ci get secretstores,externalsecrets -o yaml || true
          kubectl --namespace eso-ci describe secretstore fake || true
          kubectl --namespace eso-ci describe externalsecret eso-probe || true
          kubectl --namespace eso-ci get events --sort-by=.lastTimestamp || true

      - name: dump Strimzi state on failure
        if: failure()
        run: |
          kubectl --namespace argocd describe application workloads || true
          kubectl --namespace argocd describe application strimzi || true
          kubectl --namespace kafka get pods,kafka,kafkanodepools,kafkatopics,kafkausers -o wide || true
          kubectl --namespace kafka describe kafka cdc-platform || true
          kubectl --namespace kafka get events --sort-by=.lastTimestamp || true

      - name: dump Connect state on failure
        if: failure()
        run: |
          kubectl --namespace argocd describe application connect || true
          kubectl --namespace kafka get kafkaconnect,deployments,pods,serviceaccounts -o wide || true
          kubectl --namespace kafka describe kafkaconnect connect || true
          kubectl --namespace kafka logs deployment/connect-connect --all-containers --tail=200 || true
          kubectl --namespace kafka get events --sort-by=.lastTimestamp || true
