name: connect-smt

on:
  pull_request:
    paths:
      - "connect/smt/**"
      - ".github/workflows/connect-smt.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: connect-smt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test
    # AGENTS.md: workflows run on ubuntu-latest only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Kafka Connect 4.0 requires Java 17 for the worker runtime (KIP-1013),
          # and this jar runs inside that worker.
          java-version: "17"
          cache: maven

      - name: Build and test
        working-directory: connect/smt
        run: mvn --batch-mode --no-transfer-progress clean package
