name: terraform

# This is a public repository. The `plan` job below authenticates to Azure, so
# it is gated so that no one outside the repo can trigger it or spend money.
# Four layers, in order of importance:
#
#   1. `plan` runs only on `workflow_dispatch`, and dispatching a workflow needs
#      write access to the repo. The public, and anyone opening a pull request
#      from a fork, does not have it. Fork pull requests also receive no secrets
#      and no OIDC token from GitHub, so the `validate` job cannot reach Azure
#      either.
#   2. The `azure-plan` environment MUST be configured in repo Settings >
#      Environments with a required reviewer (Hari) and its deployment branches
#      restricted to `main`. Environment protection is enforced by GitHub even
#      if the workflow file is edited on a branch, so it is the real lock. It
#      cannot be expressed in YAML; it is a one-time repo setting.
#   3. The Azure federated credential for AZURE_CLIENT_ID MUST have its subject
#      scoped to `repo:<owner>/<repo>:environment:azure-plan`. Azure then refuses
#      to mint a token for any other trigger (a fork PR, a different branch).
#      This is created with the CI app registration in the identity ticket (P4),
#      not here.
#   4. `plan` runs `terraform plan` only. There is no `apply` or `destroy` in
#      this workflow; AGENTS.md reserves both for Hari. `plan` is read-only
#      against Azure and provisions nothing, so it cannot create a billable
#      resource even if it runs.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# One run per ref; a new push cancels an in-flight run so a rapid series of
# pushes cannot pile up jobs.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: fmt and validate (no backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/persistent
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color

  plan:
    name: plan (Hari-dispatched, gated)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-plan
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/persistent
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: terraform init (backend names from Actions variables)
        env:
          ARM_USE_OIDC: "true"
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_BACKEND_STATE_KEY }}"
      - name: terraform plan (no apply)
        env:
          ARM_USE_OIDC: "true"
        run: terraform plan -input=false -no-color
