name: PR size

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-size:
    name: pr-size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Test PR size guard
        run: python3 -m unittest scripts/ci/test_check_pr_size.py -v

      - name: Measure current base against current head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/ci/check-pr-size.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --policy .github/pr-size-policy.json \
            --labels-json "$PR_LABELS_JSON" \
            --pr-body "$PR_BODY"