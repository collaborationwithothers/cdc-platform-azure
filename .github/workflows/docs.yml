name: Verify documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/dev/**"
      - "README.md"
      - "scripts/ci/check_ascii.py"
      - "scripts/ci/test_check_ascii.py"
      - "scripts/ci/check_runbook_anchors.py"
      - "tests/ci/test_check_runbook_anchors.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ascii:
    name: Check documentation for ASCII-only punctuation
    # AGENTS.md: workflows run on ubuntu-latest only.
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation sources
        uses: actions/checkout@v7

      - name: Test the documentation punctuation checker
        run: python3 -m unittest scripts/ci/test_check_ascii.py -v

      - name: Check docs/ and scripts/dev/ contain only ASCII punctuation
        run: python3 scripts/ci/check_ascii.py docs scripts/dev

      - name: Test the session metrics command
        run: python3 -m unittest scripts/dev/test_session_metrics.py -v

  runbook-anchors:
    name: Check alert links to operator runbook steps
    # AGENTS.md: workflows run on ubuntu-latest only.
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation and runbook sources
        uses: actions/checkout@v7

      - name: Test the alert and runbook link checker
        run: python3 -m unittest tests/ci/test_check_runbook_anchors.py -v

      - name: Check that every alert names an existing runbook step
        run: python3 scripts/ci/check_runbook_anchors.py
