apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: connect
  labels: { strimzi.io/cluster: cdc-platform }
spec:
  authentication: { type: tls }
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: workflow-transitions, patternType: literal }
        operations: [Describe, Write]
      - resource: { type: topic, name: workflow-transitions-lexfield-003, patternType: literal }
        operations: [Describe, Write]
      - resource: { type: topic, name: schema-history-, patternType: prefix }
        operations: [Describe, Read, Write]
      - resource: { type: topic, name: connect-configs, patternType: literal }
        operations: [Describe, Read, Write]
      - resource: { type: topic, name: connect-offsets, patternType: literal }
        operations: [Describe, Read, Write]
      - resource: { type: topic, name: connect-status, patternType: literal }
        operations: [Describe, Read, Write]
      - resource: { type: topic, name: connect-signals-, patternType: prefix }
        operations: [Describe, Read]
      - resource: { type: group, name: connect-, patternType: prefix }
        operations: [Read]
      - resource: { type: group, name: kafka-signal-, patternType: prefix }
        operations: [Read]
---
apiVersion: kafka.strimzi.io/v1
