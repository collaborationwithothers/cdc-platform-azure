---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: operations
  labels: { strimzi.io/cluster: cdc-platform }
spec:
  authentication: { type: tls }
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: connect-signals-, patternType: prefix }
        operations: [Describe, Write]
      - resource: { type: topic, name: notifier-control, patternType: literal }
        operations: [Describe, Write]
