{{- range .Values.workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: cdc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: cdc-platform
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image | quote }}
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: platform-application-insights
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
            - name: OTEL_TRACES_SAMPLER
              value: {{ $.Values.telemetry.sampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ $.Values.telemetry.sampler_arg | quote }}
{{- end }}
