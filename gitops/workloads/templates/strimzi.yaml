{{- $delivery := .Values.delivery | default dict -}}
{{- $repoURL := get $delivery "repoURL" | default "https://github.com/collaborationwithothers/cdc-platform-azure.git" -}}
{{- $targetRevision := get $delivery "targetRevision" | default "main" -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: quay.io/strimzi-helm
      chart: strimzi-kafka-operator
      targetRevision: "1.2.0"
      helm:
        releaseName: strimzi-kafka-operator
        valuesObject:
          watchAnyNamespace: true
    - repoURL: {{ $repoURL | quote }}
      targetRevision: {{ $targetRevision | quote }}
      path: infra/disposable/kafka
      helm:
        releaseName: cdc-kafka-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  # The API server removes this empty schema map. Keep the exception on the
  # one Strimzi CRD field that otherwise remains OutOfSync.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jsonPointers:
        - /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/clusterSecurity/properties
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
