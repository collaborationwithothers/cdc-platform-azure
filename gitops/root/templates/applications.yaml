{{- $provider := .Values.externalSecrets.provider | default "disabled" -}}
{{- $validProviders := list "disabled" "fake" "azureKeyVault" -}}
{{- $delivery := .Values.delivery | default dict -}}
{{- $repoURL := get $delivery "repoURL" | default "https://github.com/collaborationwithothers/cdc-platform-azure.git" -}}
{{- $targetRevision := get $delivery "targetRevision" | default "main" -}}
{{- if not (has $provider $validProviders) -}}
{{- fail (printf "GitOps root chart rendering failed. Input artifact: externalSecrets.provider in the root chart values. Supplied value: %q. Existing rule: the provider must be one of disabled, fake, or azureKeyVault. Consequence: the chart cannot choose a backend adapter for External Secrets Operator (ESO), the controller that syncs external secret-store values into Kubernetes Secrets, so it cannot render the Argo CD Application objects that tell the cluster what to sync. Safe correction: set externalSecrets.provider to disabled (install ESO without a SecretStore), fake (use a synthetic SecretStore for local Kubernetes reconciliation checks), or azureKeyVault (use the adapter that reads Key Vault through Azure workload identity). Proven boundary: this run rejected the provider setting only; it does not prove ESO installation, Azure workload identity, or Key Vault access." $provider) -}}
{{- end -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.eso | quote }}
spec:
  project: default
  source:
    repoURL: {{ .Values.eso.repository | quote }}
    chart: {{ .Values.eso.chart | quote }}
    targetRevision: {{ .Values.eso.version | quote }}
    helm:
      valuesObject:
        installCRDs: true
        extraObjects:
          {{- if eq $provider "azureKeyVault" }}
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: {{ .Values.eso.serviceAccount | quote }}
              namespace: {{ .Values.eso.namespace | quote }}
              annotations:
                azure.workload.identity/client-id: {{ .Values.externalSecrets.identityClientId | quote }}
          - apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: azure-key-vault
              namespace: {{ .Values.eso.namespace | quote }}
            spec:
              provider:
                azurekv:
                  authType: WorkloadIdentity
                  tenantId: {{ .Values.externalSecrets.tenantId | quote }}
                  vaultUrl: {{ .Values.externalSecrets.vaultUrl | quote }}
                  serviceAccountRef:
                    name: {{ .Values.eso.serviceAccount | quote }}
          {{- else if eq $provider "fake" }}
          - apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: fake
              namespace: {{ .Values.eso.namespace | quote }}
            spec:
              provider:
                fake:
                  data:
                    - key: /eso/probe
                      value: hydrated-by-eso
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: eso-probe
              namespace: {{ .Values.eso.namespace | quote }}
            spec:
              refreshInterval: 1m
              secretStoreRef:
                name: fake
                kind: SecretStore
              target:
                name: eso-probe
                creationPolicy: Owner
              data:
                - secretKey: probe
                  remoteRef:
                    key: /eso/probe
          {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.eso.namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.strimzi | quote }}
spec:
  project: default
  source:
    repoURL: {{ $repoURL | quote }}
    targetRevision: {{ $targetRevision | quote }}
    path: gitops/workloads
    helm:
      valuesObject:
        delivery:
          repoURL: {{ $repoURL | quote }}
          targetRevision: {{ $targetRevision | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
