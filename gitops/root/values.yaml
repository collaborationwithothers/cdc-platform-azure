# The root chart consumes the values interface passed by the bootstrap chart.
# The root Application creates the ESO child first. The selected adapter is
# rendered into that child Application's Helm values.

externalSecrets:
  provider: disabled
  identityClientId: ""
  tenantId: ""
  vaultUrl: ""

# Kafka Connect is enabled only when the bootstrap supplies both non-secret
# deployment inputs. This keeps a default chart render free of placeholders.
connect:
  enabled: false
  image: ""
  identityClientId: ""

eso:
  repository: https://charts.external-secrets.io
  chart: external-secrets
  version: 2.9.0
  namespace: external-secrets
  serviceAccount: external-secrets-key-vault

# Every later Application belongs to one of these waves.
syncWaves:
  eso: "0"
  istio: "1"
  gateway: "2"
  certManager: "2"
  externalDns: "2"
  strimzi: "3"
  connect: "4"
  services: "4"
