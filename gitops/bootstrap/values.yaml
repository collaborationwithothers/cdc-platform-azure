# The root Application sources gitops/root as a Helm chart. The chart is empty
# until later tickets add child Applications, so the root manages zero resources
# and reports Synced in this ticket.

# Where Argo watches. repoURL is the public repository. targetRevision is the
# branch or tag Argo follows; the kind CI job overrides both to the branch under
# test so it can prove sync against the commit in the pull request rather than
# against whatever is on main.
repoURL: https://github.com/collaborationwithothers/cdc-platform-azure.git
targetRevision: main
rootChartPath: gitops/root

# These values cross the Terraform-to-Argo boundary through
# spec.source.helm.valuesObject. The provider selects one of the three
# External Secrets Operator adapters. The other fields are non-secret values;
# they stay empty until an environment supplies them.
externalSecrets:
  provider: disabled
  identityClientId: ""
  tenantId: ""
  vaultUrl: ""

# Argo objects. The root Application and its children live in the argocd
# namespace, which the Argo CD install creates.
rootApplicationName: root
argocdNamespace: argocd
project: default
